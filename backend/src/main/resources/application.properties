server.port=8080
spring.main.banner-mode=off
logging.level.org.springframework.web=INFO

# ── MongoDB ───────────────────────────────────────────────────────────
# Default: local MongoDB (no auth). Override with env var SPRING_DATA_MONGODB_URI
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/code_oracle_db
spring.data.mongodb.auto-index-creation=true
